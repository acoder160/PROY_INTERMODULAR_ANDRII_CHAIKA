<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--asph:#3A3D40;--curb:#F2C230;--mark:#FFFFFF;--plate:#1F5FA8;--red:#C8302C;--map:#EBE9E4}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Overpass,system-ui,sans-serif;color:var(--mark);background:var(--map);position:relative}
.map{position:absolute;inset:0;background:
 linear-gradient(28deg,transparent 47%,#fff 47%,#fff 49.5%,transparent 49.5%),
 linear-gradient(-62deg,transparent 30%,#fff 30%,#fff 32%,transparent 32%),
 linear-gradient(0deg,transparent 20%,#d6e6c8 20%,#d6e6c8 30%,transparent 30%),var(--map)}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#3FA9F5;border:3px solid #fff;box-shadow:0 0 0 10px rgba(63,169,245,.18)}
.cl{position:absolute;padding:4px 9px;border-radius:12px;background:#1d2b3a;color:#fff;font:700 13px Overpass}
.blk{position:absolute;top:52px;height:46px;padding:0 14px;display:flex;align-items:center;gap:8px;background:var(--asph);font-weight:800;font-size:15px;border-bottom:6px solid var(--curb)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:560px;background:var(--asph);border-top:8px solid var(--curb)}
.photo{height:220px;background:linear-gradient(160deg,#87a3b4 0%,#c9c2b4 38%,#a59b8b 39%,#7c7568 70%,#5d564c 100%)}
.body{padding:16px 20px}
h1{font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
.dash{height:4px;margin:10px 0 14px;background:repeating-linear-gradient(90deg,var(--mark) 0 22px,transparent 22px 36px)}
.plates{display:flex;gap:8px}
.pl{flex:1;background:var(--plate);border:2px solid var(--mark);border-radius:4px;padding:8px 10px}
.pl b{display:block;font-size:26px;font-weight:900;line-height:1}
.pl span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;height:50px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;border-radius:3px}
.pri{background:var(--curb);color:#1b1b1b}.sec{border:2px solid var(--mark)}
.cm{margin-top:14px;font-size:13px;font-weight:600}
</style></head><body>
<div class="map"></div>
<div class="pin" style="left:186px;top:200px"></div>
<div class="cl" style="left:60px;top:150px">+12</div>
<div class="blk" style="left:16px">Filters · 2</div>
<div class="blk" style="right:16px">andrii</div>
<div class="sheet">
 <div class="photo"></div>
 <div class="body">
  <h1>MACBA ledges</h1>
  <div class="dash"></div>
  <div class="plates">
   <div class="pl"><b>4.6★</b><span>23 votes</span></div>
   <div class="pl"><b>1.2 km</b><span>Away</span></div>
   <div class="pl"><b>ADV</b><span>Ledge</span></div>
  </div>
  <div class="acts"><div class="btn pri">Directions</div><div class="btn sec">Rate spot</div></div>
  <div class="cm">marta_sk8 — waxed, security after 9pm</div>
 </div>
</div>
</body></html>
