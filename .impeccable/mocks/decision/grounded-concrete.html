<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
<style>
:root{--slab:#CBCBC6;--slab-lt:#E2E1DC;--joint:#8F8E89;--ink:#141414;--mark:#FF4A1C;--hazard:#FFD400;--map:#EBE9E4}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:Archivo,system-ui,sans-serif;color:var(--ink);background:var(--map);position:relative}
.map{position:absolute;inset:0;background:
 linear-gradient(28deg,transparent 47%,#fff 47%,#fff 49.5%,transparent 49.5%),
 linear-gradient(-62deg,transparent 30%,#fff 30%,#fff 32%,transparent 32%),
 linear-gradient(0deg,transparent 20%,#d6e6c8 20%,#d6e6c8 30%,transparent 30%),var(--map)}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;background:#3FA9F5;border:3px solid #fff;box-shadow:0 0 0 10px rgba(63,169,245,.18)}
.cl{position:absolute;padding:4px 9px;border-radius:12px;background:#1d2b3a;color:#fff;font:700 13px Archivo}
.slab{position:absolute;top:52px;height:48px;padding:0 16px;display:flex;align-items:center;gap:10px;background:var(--slab);font-weight:800;font-size:15px;border:1px solid var(--joint);border-radius:3px}
.slab .n{background:var(--mark);color:var(--ink);font:700 15px "Stardos Stencil";padding:1px 7px;border-radius:2px}
.haz{position:absolute;top:110px;left:16px;right:16px;height:36px;background:var(--hazard);display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:13px;border-radius:3px}
.sheet{position:absolute;left:0;right:0;bottom:0;height:540px;background:var(--slab);border-top:1px solid var(--joint)}
.photo{height:200px;background:linear-gradient(160deg,#87a3b4 0%,#c9c2b4 38%,#a59b8b 39%,#7c7568 70%,#5d564c 100%)}
.joint{height:3px;background:var(--joint);border-bottom:1px solid var(--slab-lt)}
.head{padding:14px 20px 12px}
h1{font:700 32px/1 "Stardos Stencil",Archivo;text-transform:uppercase;letter-spacing:.01em}
.where{font-size:13px;font-weight:700;margin-top:6px}
.facts{display:flex}
.f{flex:1;padding:10px 0 10px 20px}
.f+.f{border-left:3px solid var(--joint)}
.f b{display:block;font:700 38px/1 "Stardos Stencil"}
.f span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.vote{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;font-weight:800;font-size:14px}
.tag{background:var(--mark);padding:4px 12px 3px;font:700 18px "Stardos Stencil";transform:rotate(-2deg);border-radius:2px}
.acts{display:flex;gap:10px;padding:14px 20px 0}
.btn{flex:1;height:50px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border-radius:3px}
.pri{background:var(--ink);color:#fff}.sec{border:2px solid var(--ink)}
</style></head><body>
<div class="map"></div>
<div class="pin" style="left:186px;top:220px"></div>
<div class="cl" style="left:60px;top:180px">+12</div>
<div class="cl" style="left:290px;top:250px">+4</div>
<div class="slab" style="left:16px">Filters <span class="n">2</span></div>
<div class="slab" style="right:16px">andrii</div>
<div class="haz">Server waking up · showing saved spots</div>
<div class="sheet">
 <div class="photo"></div>
 <div class="head"><h1>MACBA ledges</h1><div class="where">Plaça dels Àngels · Barcelona · Ledge</div></div>
 <div class="joint"></div>
 <div class="facts">
  <div class="f"><b>4.6</b><span>Stars · 23</span></div>
  <div class="f"><b>1.2</b><span>Km away</span></div>
  <div class="f"><b>ADV</b><span>Level</span></div>
 </div>
 <div class="joint"></div>
 <div class="vote">Your vote <span class="tag">★ 5</span></div>
 <div class="joint"></div>
 <div class="acts"><div class="btn pri">Directions</div><div class="btn sec">Comments · 8</div></div>
</div>
</body></html>
