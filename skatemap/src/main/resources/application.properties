spring.config.import=optional:dotenv:./.env

# DATOS DE CONEXION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Gzip JSON responses: the full spot list is ~1.3 MB raw and compresses about 10x
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=2048

# Connection pool. Raise DB_POOL_SIZE on a server with a local database; keep it low on hosted
# free tiers with a connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=5000

# CONFIGURACION JPA
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DATABASE MIGRATIONS
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# HEALTH CHECK: only /actuator/health, without component details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API DOCUMENTATION
app.swagger.enabled=${SWAGGER_ENABLED:false}

# SEGURIDAD JWT

skatemap.app.jwtSecret=${JWT_SECRET}
skatemap.app.jwtExpirationMs=900000
skatemap.app.refreshExpirationMs=2592000000
skatemap.app.refreshCookieSecure=${REFRESH_COOKIE_SECURE:true}
skatemap.app.refreshCookieSameSite=${REFRESH_COOKIE_SAME_SITE:Strict}

# LOGIN CON GOOGLE: IDs de cliente OAuth aceptados (web, iOS, Android), separados por comas.
# Vacío = el botón de Google responde 503 "not configured".
google.client-ids=${GOOGLE_CLIENT_IDS:}
# Login por navegador (Expo Go): secreto del cliente WEB y URL pública https de /api/auth/google/callback
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:}
# Solo desarrollo: aceptar vueltas a exp:// (Expo Go). En producción dejar en false.
google.allow-expo-go=${GOOGLE_ALLOW_EXPO_GO:false}

# DEMO: shared "try it" account (POST /api/auth/demo). Off unless DEMO_ENABLED=true.
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.username=${DEMO_USERNAME:demo}

# PUSH NOTIFICATIONS (Expo push service). false = notifications are stored but no push is sent.
app.push.enabled=${PUSH_ENABLED:true}

# RATE LIMITING
# Set to false only for load tests against staging.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Header the reverse proxy uses to pass the real client IP: X-Forwarded-For (Render/Caddy) or
# CF-Connecting-IP (Cloudflare). Empty = use the TCP peer address.
app.client-ip-header=${CLIENT_IP_HEADER:}

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# MODERACION OpenAI + Groq
ai.groq.api.key=${GROQ_API_KEY:}
ai.openai.api.key=${OPENAI_API_KEY:}
# Fotos: modelos con visión de Groq (capa gratuita), en orden. Groq retira modelos a menudo:
# comprobar https://console.groq.com/docs/vision y cambiar aquí sin tocar código.
ai.vision.models=${AI_VISION_MODELS:qwen/qwen3.8-27b}
# Respaldo de pago (céntimos) si Groq no responde
ai.vision.openai-model=${AI_OPENAI_VISION_MODEL:gpt-4o-mini}

#CORS ORIGIN
cors.allowed.origin=${FRONTEND_URL}

# CLOUDINARY (Firmas Seguras)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# SEGURIDAD CORS
cors.allowed.origins=${CORS_ORIGINS}