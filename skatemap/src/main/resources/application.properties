spring.config.import=optional:dotenv:./.env

# DATOS DE CONEXION
spring.datasource.url=jdbc:postgresql://localhost:5432/skatemap_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SEGURIDAD JWT

skatemap.app.jwtSecret=${JWT_SECRET}
skatemap.app.jwtExpirationMs=86400000

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# MODERACION OpenAI + Groq
ai.groq.api.key=${GROQ_API_KEY}
ai.openai.api.key=${OPENAI_API_KEY}

#CORS ORIGIN
cors.allowed.origin=${FRONTEND_URL}

# CLOUDINARY (Firmas Seguras)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}