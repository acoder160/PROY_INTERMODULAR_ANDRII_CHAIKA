# DATOS DE CONEXION
spring.datasource.url=jdbc:postgresql://localhost:5432/skatemap_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SEGURIDAD JWT
skatemap.app.jwtSecret=EstaEsUnaClaveSuperSecretaYUltraLargaParaQueElAlgoritmoHS512NoSeQuejeDeQueEsCortaYFuncionePerfectamenteEn2026_MasTextoParaAsegurar512Bits
skatemap.app.jwtExpirationMs=86400000

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB