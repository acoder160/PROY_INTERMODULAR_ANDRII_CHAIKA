spring.config.import=optional:dotenv:./.env

# DATOS DE CONEXION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# CONFIGURACION JPA
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# DATABASE MIGRATIONS
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# API DOCUMENTATION
app.swagger.enabled=${SWAGGER_ENABLED:false}

# SEGURIDAD JWT

skatemap.app.jwtSecret=${JWT_SECRET}
skatemap.app.jwtExpirationMs=900000
skatemap.app.refreshExpirationMs=2592000000
skatemap.app.refreshCookieSecure=${REFRESH_COOKIE_SECURE:true}
skatemap.app.refreshCookieSameSite=${REFRESH_COOKIE_SAME_SITE:Strict}

# SUBIDA DE ARCHIVOS
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# MODERACION OpenAI + Groq
ai.groq.api.key=${GROQ_API_KEY}
ai.openai.api.key=${OPENAI_API_KEY}

#CORS ORIGIN
cors.allowed.origin=${FRONTEND_URL}

# CLOUDINARY (Firmas Seguras)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# SEGURIDAD CORS
cors.allowed.origins=${CORS_ORIGINS}